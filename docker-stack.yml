version: '3.8'

services:
  facecrop-api:
    image: automacaodebaixocusto/facecrop-api:latest
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      placement:
        constraints:
          - node.role == manager
        preferences:
          - spread: node.labels.zone
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - facecrop-network

networks:
  facecrop-network:
    driver: overlay

